<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PM Agent</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --text: #1d2330;
    --muted: #667085;
    --border: #e3e6eb;
    --accent: #1f4e8c;
    --accent-text: #ffffff;
    --user-bubble: #1f4e8c;
    --agent-bubble: #ffffff;
    --chip: #eef2f8;
    --error: #b42318;
    --error-bg: #fef3f2;
    --overlay: rgba(245, 246, 248, 0.78);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b;
      --panel: #1a1e26;
      --text: #e6e8ec;
      --muted: #98a2b3;
      --border: #2b313c;
      --accent: #6b9de0;
      --accent-text: #0d1117;
      --user-bubble: #2d5fa3;
      --agent-bubble: #1f242e;
      --chip: #232a36;
      --error: #f97066;
      --error-bg: #2a1715;
      --overlay: rgba(10, 12, 30, 0.35);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:
      linear-gradient(var(--overlay), var(--overlay)),
      url("/static/background.jpg") center / cover no-repeat fixed;
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  button { font: inherit; cursor: pointer; }
  .hidden { display: none !important; }

  /* ---------- login ---------- */
  #login-screen { flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .login-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 32px; width: 100%; max-width: 360px;
  }
  .login-card h1 { margin: 0 0 4px; font-size: 22px; }
  .login-card p { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
  .login-card label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 6px; }
  .login-card input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text); font: inherit;
  }
  .login-card button {
    width: 100%; margin-top: 20px; padding: 11px; border: 0; border-radius: 8px;
    background: var(--accent); color: var(--accent-text); font-weight: 600;
  }
  #login-error { color: var(--error); font-size: 13px; min-height: 18px; margin-top: 10px; }

  /* ---------- chat layout ---------- */
  #chat-screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  header {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 17px; flex: 1; }
  header .user { color: var(--muted); font-size: 13px; }
  header button {
    border: 1px solid var(--border); background: transparent; color: var(--text);
    border-radius: 8px; padding: 6px 12px; font-size: 13px;
  }
  #messages { flex: 1; overflow-y: auto; padding: 20px 16px; }
  .inner { max-width: 820px; margin: 0 auto; }

  .welcome { text-align: center; padding: 40px 0 16px; }
  .welcome h2 { margin: 0 0 6px; font-size: 20px; }
  .welcome p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chips button {
    border: 1px solid var(--border); background: var(--chip); color: var(--text);
    border-radius: 999px; padding: 8px 14px; font-size: 13px;
  }

  .msg { display: flex; margin: 12px 0; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 85%; padding: 10px 14px; border-radius: 12px; line-height: 1.5;
    font-size: 14.5px; overflow-wrap: anywhere;
  }
  .msg.user .bubble { background: var(--user-bubble); color: #fff; border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .msg.agent .bubble { background: var(--agent-bubble); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.error .bubble { background: var(--error-bg); color: var(--error); border: 1px solid var(--error); }
  .bubble p { margin: 0 0 8px; }
  .bubble p:last-child, .bubble ul:last-child { margin-bottom: 0; }
  .bubble ul { margin: 0 0 8px; padding-left: 20px; }
  .bubble code { background: var(--chip); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .bubble a { color: var(--accent); }
  .table-wrap { overflow-x: auto; margin: 4px 0 8px; }
  .bubble table { border-collapse: collapse; font-size: 13px; }
  .bubble th, .bubble td { border: 1px solid var(--border); padding: 5px 8px; text-align: left; vertical-align: top; }
  .bubble th { background: var(--chip); }
  .tools { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
  .tools span {
    font-size: 11px; color: var(--muted); border: 1px solid var(--border);
    border-radius: 999px; padding: 2px 8px;
  }
  .typing span {
    display: inline-block; width: 7px; height: 7px; margin: 0 2px; border-radius: 50%;
    background: var(--muted); animation: blink 1.2s infinite both;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  /* ---------- input ---------- */
  footer { background: var(--panel); border-top: 1px solid var(--border); padding: 12px 16px; }
  form.send { display: flex; gap: 8px; max-width: 820px; margin: 0 auto; }
  form.send textarea {
    flex: 1; resize: none; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--bg); color: var(--text); font: inherit; max-height: 140px;
  }
  form.send button {
    border: 0; border-radius: 10px; padding: 0 18px; background: var(--accent);
    color: var(--accent-text); font-weight: 600;
  }
  form.send button:disabled { opacity: .5; cursor: default; }
  .hint { max-width: 820px; margin: 6px auto 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>

<!-- ======== LOGIN ======== -->
<div id="login-screen" class="hidden">
  <form class="login-card" id="login-form">
    <h1>PM Agent</h1>
    <p>Sign in to track IT projects.</p>
    <label for="username">Username</label>
    <input id="username" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="login-button">Sign in</button>
    <div id="login-error"></div>
  </form>
</div>

<!-- ======== CHAT ======== -->
<div id="chat-screen" class="hidden">
  <header>
    <h1>PM Agent</h1>
    <span class="user" id="user-name"></span>
    <button id="new-chat">New chat</button>
    <button id="logout">Log out</button>
  </header>

  <div id="messages">
    <div class="inner" id="message-list">
      <div class="welcome" id="welcome">
        <h2>What would you like to know?</h2>
        <p>Ask about project progress, delays, developers or holidays.</p>
        <div class="chips">
          <button>What needs attention?</button>
          <button>How are the projects going?</button>
          <button>What has Kasun worked on this week?</button>
          <button>List holidays</button>
          <button>Refresh the summary</button>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <form class="send" id="send-form">
      <textarea id="input" rows="1" placeholder="Ask the PM agent..." maxlength="2000"></textarea>
      <button type="submit" id="send-button">Send</button>
    </form>
    <div class="hint">Enter to send, Shift+Enter for a new line. Figures come from the project sheets; the agent never edits them.</div>
  </footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
let busy = false;

// ---------- screens ----------
function showLogin() {
  $("chat-screen").classList.add("hidden");
  $("login-screen").classList.remove("hidden");
  $("username").focus();
}

function showChat(user) {
  $("login-screen").classList.add("hidden");
  $("chat-screen").classList.remove("hidden");
  $("user-name").textContent = user;
  $("input").focus();
}

// ---------- talking to the server ----------
async function api(path, body) {
  const response = await fetch(path, {
    method: body === undefined ? "GET" : "POST",
    headers: { "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await response.json().catch(() => ({}));
  if (response.status === 401 && path !== "/api/login") {
    showLogin();
  }
  if (!response.ok) {
    throw new Error(data.detail || `Request failed (${response.status})`);
  }
  return data;
}

// ---------- safe markdown ----------
function escapeHtml(text) {
  return text.replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

function inline(text) {
  return escapeHtml(text)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/(https:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}

function renderMarkdown(text) {
  const lines = text.replace(/\r/g, "").split("\n");
  let html = "";
  let i = 0;
  while (i < lines.length) {
    const line = lines[i].trim();
    if (line.startsWith("|")) {
      const rows = [];
      while (i < lines.length && lines[i].trim().startsWith("|")) {
        rows.push(lines[i].trim());
        i++;
      }
      const cells = (row) => row.replace(/^\||\|$/g, "").split("|").map((c) => inline(c.trim()));
      const body = rows.filter((r) => !/^\|[\s:|-]+\|$/.test(r));
      html += '<div class="table-wrap"><table>';
      body.forEach((row, n) => {
        const tag = n === 0 ? "th" : "td";
        html += "<tr>" + cells(row).map((c) => `<${tag}>${c}</${tag}>`).join("") + "</tr>";
      });
      html += "</table></div>";
    } else if (/^[-*•]\s+/.test(line)) {
      html += "<ul>";
      while (i < lines.length && /^[-*•]\s+/.test(lines[i].trim())) {
        html += "<li>" + inline(lines[i].trim().replace(/^[-*•]\s+/, "")) + "</li>";
        i++;
      }
      html += "</ul>";
    } else if (line === "") {
      i++;
    } else {
      const para = [];
      while (i < lines.length && lines[i].trim() !== "" &&
             !lines[i].trim().startsWith("|") && !/^[-*•]\s+/.test(lines[i].trim())) {
        para.push(inline(lines[i].trim().replace(/^#+\s*/, "")));
        i++;
      }
      html += "<p>" + para.join("<br>") + "</p>";
    }
  }
  return html;
}

// ---------- messages ----------
function addMessage(kind, text, tools) {
  $("welcome")?.remove();
  const row = document.createElement("div");
  row.className = `msg ${kind}`;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  if (kind === "agent") {
    bubble.innerHTML = renderMarkdown(text);
    if (tools && tools.length) {
      const box = document.createElement("div");
      box.className = "tools";
      [...new Set(tools)].forEach((name) => {
        const tag = document.createElement("span");
        tag.textContent = "used: " + name;
        box.appendChild(tag);
      });
      bubble.appendChild(box);
    }
  } else {
    bubble.textContent = text;
  }
  row.appendChild(bubble);
  $("message-list").appendChild(row);
  $("messages").scrollTop = $("messages").scrollHeight;
  return row;
}

function addTyping() {
  const row = document.createElement("div");
  row.className = "msg agent";
  row.innerHTML = '<div class="bubble typing"><span></span><span></span><span></span></div>';
  $("message-list").appendChild(row);
  $("messages").scrollTop = $("messages").scrollHeight;
  return row;
}

async function send(text) {
  text = text.trim();
  if (!text || busy) return;
  busy = true;
  $("send-button").disabled = true;
  $("input").value = "";
  autoGrow();
  addMessage("user", text);
  const typing = addTyping();
  try {
    const data = await api("/api/chat", { message: text });
    typing.remove();
    addMessage("agent", data.reply, data.tools);
  } catch (error) {
    typing.remove();
    addMessage("error", error.message);
  } finally {
    busy = false;
    $("send-button").disabled = false;
    $("input").focus();
  }
}

function autoGrow() {
  const box = $("input");
  box.style.height = "auto";
  box.style.height = Math.min(box.scrollHeight, 140) + "px";
}

// ---------- events ----------
$("login-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  $("login-error").textContent = "";
  $("login-button").disabled = true;
  try {
    const data = await api("/api/login", {
      username: $("username").value,
      password: $("password").value,
    });
    $("password").value = "";
    showChat(data.user);
  } catch (error) {
    $("login-error").textContent = error.message;
  } finally {
    $("login-button").disabled = false;
  }
});

$("send-form").addEventListener("submit", (event) => {
  event.preventDefault();
  send($("input").value);
});

$("input").addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    send($("input").value);
  }
});
$("input").addEventListener("input", autoGrow);

document.querySelectorAll(".chips button").forEach((chip) =>
  chip.addEventListener("click", () => send(chip.textContent)));

$("new-chat").addEventListener("click", async () => {
  await api("/api/new-chat", {}).catch(() => {});
  location.reload();
});

$("logout").addEventListener("click", async () => {
  await api("/api/logout", {}).catch(() => {});
  location.reload();
});

// ---------- start ----------
api("/api/me").then((data) => showChat(data.user)).catch(() => showLogin());
</script>
</body>
</html>
